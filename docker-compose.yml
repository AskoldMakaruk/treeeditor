services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: treeeditor
      POSTGRES_PASSWORD: treeeditor
      POSTGRES_DB: treeeditor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treeeditor -d treeeditor"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=treeeditor;Username=treeeditor;Password=treeeditor"
      Redis__Configuration: "redis:6379"
      Redis__Enabled: "true"
      ASPNETCORE_URLS: "http://+:5080"
    ports:
      - "5080:5080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/5080' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:5080"
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
